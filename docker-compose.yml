services:

  # =========================================================
  # NETWORK
  # =========================================================

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "${HOST_LAN_IP}:53:53/tcp"
      - "${HOST_LAN_IP}:53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - ./pihole/etc:/etc/pihole
      - ./pihole/dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

  nginx-proxy-manager:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

  # =========================================================
  # ADMIN
  # =========================================================

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_CLEANUP: "true"

  # =========================================================
  # FILES (Nextcloud + DB + Redis)
  # =========================================================

  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "nextcloud"
      MARIADB_USER: "nextcloud"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    volumes:
      - ./nextcloud/db:/var/lib/mysql

  nextcloud-redis:
    container_name: nextcloud-redis
    image: redis:alpine
    restart: unless-stopped

  nextcloud:
    container_name: nextcloud
    image: nextcloud:latest
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${MARIADB_PASSWORD}"
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_TRUSTED_DOMAINS: "${HOST_LAN_IP}"
      TZ: "${TZ}"
    volumes:
      - ./nextcloud/html:/var/www/html
      - ./nextcloud/data:/var/www/html/data

  # =========================================================
  # MEDIA — Jellyfin + *arr pipeline
  # =========================================================

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/media:/media
    environment:
      TZ: "${TZ}"

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./radarr/config:/config
      - /mnt/media:/media
    ports:
      - "7878:7878"

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./sonarr/config:/config
      - /mnt/media:/media
    ports:
      - "8989:8989"

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./bazarr/config:/config
      - /mnt/media:/media
    ports:
      - "6767:6767"

  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696"

  qbittorrent:
    container_name: qbittorrent
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      WEBUI_PORT: 8083
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/media:/media
    ports:
      - "8083:8083"
      - "6881:6881"
      - "6881:6881/udp"

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    ports:
      - "8191:8191"

  jellyseerr:
    container_name: jellyseerr
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: "${TZ}"
      PORT: 5055
    volumes:
      - ./jellyseerr/config:/app/config
    ports:
      - "5055:5055"

  # =========================================================
  # GAME SERVER
  # =========================================================

  sevendtd:
    container_name: 7dtd
    image: vinanrra/7dtd-server:latest
    restart: unless-stopped
    ports:
      - "26900:26900/tcp"
      - "26900:26900/udp"
      - "26901:26901/udp"
      - "26902:26902/udp"
    environment:
      START_MODE: "1"
      VERSION: "stable"
      TimeZone: "${TZ}"
    volumes:
      - ./7dtd/config:/home/sdtdserver/serverfiles
      - ./7dtd/saves:/home/sdtdserver/.local/share/7DaysToDie
      - ./7dtd/backups:/home/sdtdserver/lgsm/backup
      - ./7dtd/logs:/home/sdtdserver/log

  # =========================================================
  # NOTIFICATIONS
  # =========================================================

  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    ports:
      - "8095:80"
    environment:
      TZ: "${TZ}"
      NTFY_BASE_URL: "http://${HOST_LAN_IP}:8095"
      # iOS cannot hold a background connection, so a self-hosted server can
      # only reach an iPhone by forwarding a wake-up ping through ntfy.sh,
      # which relays it via APNS. Only a hash of the topic leaves the network -
      # message bodies are still served from here.
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
      NTFY_AUTH_FILE: "/var/lib/ntfy/user.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/cache/ntfy/attachments"
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ./ntfy/lib:/var/lib/ntfy
      - ./ntfy/cache:/var/cache/ntfy

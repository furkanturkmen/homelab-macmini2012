services:

  # =========================================================
  # NETWORK
  # =========================================================

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "${HOST_LAN_IP}:53:53/tcp"
      - "${HOST_LAN_IP}:53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - ./pihole/etc:/etc/pihole
      - ./pihole/dnsmasq:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

  nginx-proxy-manager:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

  # =========================================================
  # ADMIN
  # =========================================================

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_CLEANUP: "true"

  # =========================================================
  # FILES (Nextcloud + DB + Redis)
  # =========================================================

  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "nextcloud"
      MARIADB_USER: "nextcloud"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    volumes:
      - ./nextcloud/db:/var/lib/mysql

  nextcloud-redis:
    container_name: nextcloud-redis
    image: redis:alpine
    restart: unless-stopped

  nextcloud:
    container_name: nextcloud
    image: nextcloud:latest
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "${MARIADB_PASSWORD}"
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_TRUSTED_DOMAINS: "${HOST_LAN_IP}"
      TZ: "${TZ}"
    volumes:
      - ./nextcloud/html:/var/www/html
      - /mnt/storage/documents:/var/www/html/data

  # =========================================================
  # MEDIA — Jellyfin + *arr pipeline
  # =========================================================

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/storage/media:/media
    environment:
      TZ: "${TZ}"

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./radarr/config:/config
      - /mnt/storage/media:/media
    ports:
      - "7878:7878"

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./sonarr/config:/config
      - /mnt/storage/media:/media
    ports:
      - "8989:8989"

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./bazarr/config:/config
      - /mnt/storage/media:/media
    ports:
      - "6767:6767"

  prowlarr:
    container_name: prowlarr
    image: linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696"

  # WireGuard tunnel that qBittorrent lives inside. Nothing else routes through
  # it - Jellyfin, Nextcloud and the *arr apps keep the normal connection.
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # qBittorrent has no network of its own, so its ports are published here
    ports:
      - "8083:8083"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      TZ: "${TZ}"
      # "custom" rather than "protonvpn" on purpose. With the protonvpn
      # provider, gluetun supplies the peer public key and endpoint from its
      # own bundled server list - and when that is out of step with reality the
      # handshake is rejected silently, because WireGuard never reports a bad
      # peer. Every value below comes from the .conf Proton issued instead, so
      # there is nothing left to be stale.
      VPN_SERVICE_PROVIDER: "custom"
      VPN_TYPE: "wireguard"
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
      WIREGUARD_PUBLIC_KEY: "${WIREGUARD_PUBLIC_KEY}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES}"
      VPN_ENDPOINT_IP: "${VPN_ENDPOINT_IP}"
      VPN_ENDPOINT_PORT: "${VPN_ENDPOINT_PORT}"
      # Proton only permits DNS to their own resolver inside the tunnel.
      # gluetun defaults to DNS-over-TLS via Cloudflare, which Proton resets -
      # so every lookup fails, the healthcheck fails, and it restart-loops even
      # though the tunnel itself is fine. Use the resolver from Proton's config.
      DOT: "off"
      DNS_ADDRESS: "10.2.0.1"
      # Give the tunnel room to settle before the healthcheck starts killing
      # and restarting it - a 10s loop makes every failure look identical and
      # leaves no window to diagnose anything.
      HEALTH_VPN_DURATION_INITIAL: "120s"
      # Proton hands out a new forwarded port on every reconnect; without
      # pushing it into qBittorrent it would keep announcing a dead one and
      # quietly stop accepting incoming peers.
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: "protonvpn"
      VPN_PORT_FORWARDING_UP_COMMAND: "/gluetun/update-qbit-port.sh {{PORTS}}"
      # Reply traffic to the WebUI. Without these the firewall drops responses
      # to anything off the container network - LAN and VPN clients included.
      FIREWALL_OUTBOUND_SUBNETS: "192.168.68.0/22,100.64.0.0/10,172.16.0.0/12"
    volumes:
      - ./gluetun:/gluetun

  qbittorrent:
    container_name: qbittorrent
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    # Shares gluetun's network namespace: if the tunnel drops there is no other
    # interface to fall back to, so it cannot leak. A real kill switch rather
    # than a best-effort interface bind.
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      TZ: "${TZ}"
      WEBUI_PORT: 8083
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/storage/media:/media

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
    ports:
      - "8191:8191"

  jellyseerr:
    container_name: jellyseerr
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: "${TZ}"
      PORT: 5055
    volumes:
      - ./jellyseerr/config:/app/config
    ports:
      - "5055:5055"

  # =========================================================
  # GAME SERVER
  # =========================================================

  sevendtd:
    container_name: 7dtd
    image: vinanrra/7dtd-server:latest
    restart: unless-stopped
    ports:
      - "26900:26900/tcp"
      - "26900:26900/udp"
      - "26901:26901/udp"
      - "26902:26902/udp"
    environment:
      START_MODE: "1"
      VERSION: "stable"
      TimeZone: "${TZ}"
    volumes:
      - ./7dtd/config:/home/sdtdserver/serverfiles
      - ./7dtd/saves:/home/sdtdserver/.local/share/7DaysToDie
      - ./7dtd/backups:/home/sdtdserver/lgsm/backup
      - ./7dtd/logs:/home/sdtdserver/log

  # =========================================================
  # NOTIFICATIONS
  # =========================================================

  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    ports:
      - "8095:80"
    environment:
      TZ: "${TZ}"
      # The Netbird address, not the LAN one: a phone subscribes over the VPN
      # when away from home, and links inside notifications have to resolve
      # from there too.
      NTFY_BASE_URL: "${NTFY_BASE_URL}"
      # iOS cannot hold a background connection, so a self-hosted server can
      # only reach an iPhone by forwarding a wake-up ping through ntfy.sh,
      # which relays it via APNS. Only a hash of the topic leaves the network -
      # message bodies are still served from here.
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
      NTFY_AUTH_FILE: "/var/lib/ntfy/user.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_ATTACHMENT_CACHE_DIR: "/var/cache/ntfy/attachments"
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ./ntfy/lib:/var/lib/ntfy
      - ./ntfy/cache:/var/cache/ntfy

  jellylab-push:
    container_name: jellylab-push
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: node /app/index.mjs
    ports:
      - "8099:8099"
    environment:
      TZ: "${TZ}"
      NTFY_URL: "http://ntfy"
      NTFY_TOPIC: "${NTFY_TOPIC}"
      NTFY_USER: "${NTFY_USER}"
      NTFY_PASSWORD: "${NTFY_PASSWORD}"
      PUSH_REGISTER_SECRET: "${PUSH_REGISTER_SECRET}"
      DEVICES_FILE: "/data/devices.json"
      # Read-only use of the *arr queues, so /downloads can page through the
      # whole thing. The keys live in .env, which is gitignored - the app asks
      # this service rather than holding a credential that can rewrite the
      # library.
      SONARR_URL: "http://sonarr:8989"
      SONARR_API_KEY: "${SONARR_API_KEY}"
      RADARR_URL: "http://radarr:7878"
      RADARR_API_KEY: "${RADARR_API_KEY}"
      # Sonarr and Radarr refresh their queues from qBittorrent once a minute,
      # so anything derived from them is up to a minute stale - over a gigabyte
      # at 20MB/s. Reading the client directly gives live progress and speed,
      # and is the only place a seed count exists at all.
      #
      # Optional: with no password set, /downloads answers exactly as before.
      # Read-only use of the torrent list; this never adds or removes a torrent.
      QBIT_URL: "http://gluetun:8083"
      QBIT_USER: "${QBIT_USER}"
      QBIT_PASSWORD: "${QBIT_PASSWORD}"
    volumes:
      - ./jellylab-push:/app:ro
      - ./jellylab-push-data:/data
      # read-only, purely so /storage can report free space on the media disk
      - /mnt/storage/media:/media:ro
    depends_on:
      - ntfy

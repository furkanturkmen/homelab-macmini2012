# Included by every NPM proxy host, so everything here has to be inert unless
# the maps in custom/http.conf matched. They resolve to an empty string for any
# other host or origin, and headers-more treats an empty value as "clear this
# header" - which, for a response that never had it, is a no-op.
#
# more_set_headers rather than add_header: NPM's own proxy include sets
# X-Served-By inside `location /`, and a location that defines any add_header
# drops every inherited one. Server-level add_headers therefore reach the
# preflight 204 below (returned before any location) but never a proxied
# response - which is the half that matters.
#
# Vary: Origin is deliberately not set. It would have to be set unconditionally
# here, and that would clear the upstream Vary of every other service behind
# this proxy.

more_set_headers "Access-Control-Allow-Origin: $jellylab_cors_origin";
more_set_headers "Access-Control-Allow-Credentials: $jellylab_cors_credentials";
more_set_headers "Access-Control-Allow-Methods: $jellylab_cors_methods";
more_set_headers "Access-Control-Allow-Headers: $jellylab_cors_headers";

# A preflight never reaches Jellyseerr, which answers OPTIONS with 405.
if ($jellylab_cors_preflight) {
    return 204;
}

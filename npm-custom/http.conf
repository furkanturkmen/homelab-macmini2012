# Added for the JellyLab web build (npx expo start --web).
#
# Jellyseerr sends no access-control-* headers of its own, so a browser refuses
# to hand its answers to a page on another origin - which is every page the Expo
# dev server serves. Opening the same URL in a tab works because a top-level
# navigation is not a cross-origin read, so the service looks fine by hand and
# fails from the app.
#
# Scoped twice: only the jellyseerr host, and only the dev server's own origin.
#
# Every default here is the upstream's own header rather than an empty string.
# custom/server_proxy.conf is included by *every* proxy host, and headers-more
# reads an empty value as "clear this header" - which silently stripped
# Jellyfin's own `Access-Control-Allow-Origin: *` the first time round. Echoing
# what the upstream sent leaves untouched hosts exactly as they were.
#
# Host and origin are matched separately and combined afterwards. A single
# "host|origin" key overflows the default 64-byte map hash bucket, and raising
# map_hash_bucket_size in this include is a duplicate directive.

map $host $jellylab_cors_host {
    default                     0;
    jellyseerr.yourdomain.internal 1;
    jellyseerr.yourdomain.lan      1;
}

map $http_origin $jellylab_dev_origin {
    default                 "";
    "http://localhost:8082" "http://localhost:8082";
    "http://127.0.0.1:8082" "http://127.0.0.1:8082";
}

map "$jellylab_cors_host$jellylab_dev_origin" $jellylab_cors_origin {
    default        $upstream_http_access_control_allow_origin;
    "~^1https?://" $http_origin;
}

# Credentials rather than a wildcard origin: Jellyseerr authenticates with a
# connect.sid cookie, and a browser will not send one to an origin answering
# "*". Naming the origin is what makes that legal.
map "$jellylab_cors_host$jellylab_dev_origin" $jellylab_cors_credentials {
    default        $upstream_http_access_control_allow_credentials;
    "~^1https?://" "true";
}

map "$jellylab_cors_host$jellylab_dev_origin" $jellylab_cors_methods {
    default        $upstream_http_access_control_allow_methods;
    "~^1https?://" "GET, POST, PUT, PATCH, DELETE, OPTIONS";
}

map "$jellylab_cors_host$jellylab_dev_origin" $jellylab_cors_headers {
    default        $upstream_http_access_control_allow_headers;
    "~^1https?://" "Content-Type, Authorization, X-Api-Key";
}

# A preflight is the OPTIONS a browser sends before the real request. Jellyseerr
# answers those 405, so nginx has to. Gated on the same match, because OPTIONS
# means something real to other services behind this proxy - Nextcloud's WebDAV
# for one, which would break if every OPTIONS got a bare 204.
map "$request_method$jellylab_cors_host$jellylab_dev_origin" $jellylab_cors_preflight {
    default               0;
    "~^OPTIONS1https?://" 1;
}
